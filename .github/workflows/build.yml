name: Build README

on:
  push:
    branches: [main]
    paths: ["data/papers.json", "config/taxonomy.json", "README.template.md", "scripts/**"]
  pull_request:
    paths: ["data/papers.json", "config/**", "README.template.md", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验 JSON 与必填字段
        run: python3 scripts/validate.py

      - name: PR 上只检查是否同步
        if: github.event_name == 'pull_request'
        run: python3 scripts/build_readme.py --check

      - name: 主干上重建并提交
        if: github.event_name == 'push'
        run: |
          python3 scripts/build_readme.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: 重建 README" && git push)
